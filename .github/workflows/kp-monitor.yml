name: KP AI cloud monitor

on:
  workflow_dispatch:
  schedule:
    - cron: '3-59/5 * * * *'

permissions:
  contents: read

concurrency:
  group: kp-cloud-monitor
  cancel-in-progress: false

jobs:
  scan:
    # ubuntu-latest can move to new Ubuntu releases where Playwright's apt
    # dependencies lag behind; use a known supported runner image.
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      WORKER_URL: ${{ secrets.WORKER_URL }}
      INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
      MAX_ADS: '12'
      PAGES_PER_SEARCH: '1'
      SCANS_PER_RUN: '2'
      DIAGNOSTIC_ONLY: 'false'
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install npm packages
        shell: bash
        run: |
          set -euo pipefail
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      # Do NOT use --with-deps as the first step: it invokes apt and can fail
      # before the browser download even when the runner already has the libs.
      - name: Install Chromium browser
        shell: bash
        run: |
          set -euo pipefail
          npx playwright install chromium

      - name: Verify Chromium actually launches
        shell: bash
        run: |
          set -euo pipefail
          if ! node --input-type=module -e 'import { chromium } from "playwright"; const browser = await chromium.launch({ headless: true }); console.log("CHROMIUM_OK", browser.version()); await browser.close();'; then
            echo 'Chromium could not launch. Installing OS libraries and retrying...'
            npx playwright install-deps chromium
            node --input-type=module -e 'import { chromium } from "playwright"; const browser = await chromium.launch({ headless: true }); console.log("CHROMIUM_OK", browser.version()); await browser.close();'
          fi

      - name: Check required Worker configuration
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$WORKER_URL" ] || [ -z "$INGEST_TOKEN" ]; then
            echo 'Missing WORKER_URL or INGEST_TOKEN GitHub Actions secret' >&2
            exit 1
          fi

      - name: Scan new adverts and forward to Cloudflare Worker
        shell: bash
        run: npm run monitor
